<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Thanh</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="frame">
    <div class="frame-glow"></div>

    <h1 class="title">Luyện Thanh</h1>

    <div class="buttons">
      <button class="btn" data-sound="C.mp3">C Tone Đồ</button>
      <button class="btn" data-sound="D.mp3">D Tone Rê</button>
      <button class="btn" data-sound="E.mp3">E Tone Mi</button>
      <button class="btn" data-sound="F.mp3">F Tone Fa</button>
      <button class="btn" data-sound="G.mp3">G Tone Sol</button>
      <button class="btn" data-sound="A.mp3">A Tone La</button>
      <button class="btn btn-center" data-sound="B.mp3">B Tone Si</button>
    </div>

    <footer class="footer">Thiết Kế Trần Cường - Zalo 0907860662</footer>
  </div>

  <div class="poem-overlay" id="poemOverlay">
  <div class="poem-box">
    <h2 class="poem-title" id="poemTitle"></h2>
    <p>Quan Âm Bồ Tát Diện Nhiên Vương</p>
    <p>Thống Lãnh Cô Hồn Phó Đạo Tràng</p>
    <p>Hỷ Xả Từ Bi Thường Tế Vật</p>
    <p>Hà Sa Ngạ Quỷ Tận Siêu Thăng</p>
    <p>Nam Mô Diện Nhiên Vương Bồ Tát</p>
  </div>
</div>

  <audio id="audioPlayer"></audio>
  <script src="script.js"></script>
</body>
</html>
